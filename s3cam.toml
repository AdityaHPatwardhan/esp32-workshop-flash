# ESP Launchpad Quick Start config for the PICT ESP32 workshop (s3cam boards).
# Open: https://espressif.github.io/esp-launchpad/?flashConfigURL=https://adityahpatwardhan.github.io/esp32-workshop-flash/s3cam.toml

esp_toml_version = 1.0
firmware_images_url = "https://adityahpatwardhan.github.io/esp32-workshop-flash/s3cam/"
supported_apps = ["1-Hello-Board", "2-Person-Detector", "3-RainMaker-Switch", "Hello-Board-usbconsole", "Person-Detector-usbconsole"]

[1-Hello-Board]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "01_blink-merged.bin"
description = "Prints a report about your board, shows it on the projector, then blinks the LED. Type: team <name> in the console."
console_baudrate = 115200

[2-Person-Detector]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "03_person_detector-merged.bin"
description = "TinyML person detection. Type: team <name> in the console, then watch the projector."
console_baudrate = 115200

[3-RainMaker-Switch]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "esp32s3_RainMaker_switch.bin"
description = "ESP RainMaker switch (Espressif example). Scan the QR code in the console with the ESP RainMaker app."
console_baudrate = 115200
ios_app_url = "https://apps.apple.com/app/esp-rainmaker/id1497491540"
android_app_url = "https://play.google.com/store/apps/details?id=com.espressif.rainmaker"

# Only if typing in the console does nothing (board's USB-C goes straight to the chip's native USB)
[Hello-Board-usbconsole]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "01_blink-usbconsole-merged.bin"
description = "Hello Board, console on the chip's native USB. Use only if typing in the console does nothing."
console_baudrate = 115200

[Person-Detector-usbconsole]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "03_person_detector-usbconsole-merged.bin"
description = "Person Detector, console on the chip's native USB. Use only if typing in the console does nothing."
console_baudrate = 115200
