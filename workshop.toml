# ESP Launchpad config for the PICT ESP32 workshop: ONE link for every board.
# Launchpad detects the chip and picks the matching image:
#   ESP32    -> AI-Thinker ESP32-CAM builds (esp32cam/)
#   ESP32-S3 -> generic ESP32-S3-CAM builds  (s3cam/)
# Open: https://espressif.github.io/esp-launchpad/?flashConfigURL=https://adityahpatwardhan.github.io/esp32-workshop-flash/workshop.toml

esp_toml_version = 1.0
firmware_images_url = "https://adityahpatwardhan.github.io/esp32-workshop-flash/"
supported_apps = ["1-Hello-Board", "2-Person-Detector", "3-RainMaker-Switch", "Hello-Board-usbconsole", "Person-Detector-usbconsole"]

[1-Hello-Board]
chipsets = ["ESP32", "ESP32-S3"]
image.esp32 = "esp32cam/01_blink-merged.bin"
image.esp32-s3 = "s3cam/01_blink-merged.bin"
description = "Prints a report about your board, shows it on the projector, then blinks the LED. Type: team <name> in the console."
console_baudrate = 115200

[2-Person-Detector]
chipsets = ["ESP32", "ESP32-S3"]
image.esp32 = "esp32cam/03_person_detector-merged.bin"
image.esp32-s3 = "s3cam/03_person_detector-merged.bin"
description = "TinyML person detection. Type: team <name> in the console, then watch the projector."
console_baudrate = 115200

[3-RainMaker-Switch]
chipsets = ["ESP32", "ESP32-S3"]
image.esp32 = "esp32cam/esp32_RainMaker_switch.bin"
image.esp32-s3 = "s3cam/esp32s3_RainMaker_switch.bin"
description = "ESP RainMaker switch (Espressif example). Scan the QR code in the console with the ESP RainMaker app."
console_baudrate = 115200
ios_app_url = "https://apps.apple.com/app/esp-rainmaker/id1497491540"
android_app_url = "https://play.google.com/store/apps/details?id=com.espressif.rainmaker"

# ESP32-S3 boards only, if typing in the console does nothing (USB-C wired to the chip's native USB)
[Hello-Board-usbconsole]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "s3cam/01_blink-usbconsole-merged.bin"
description = "ESP32-S3 only: Hello Board with the console on the chip's native USB."
console_baudrate = 115200

[Person-Detector-usbconsole]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "s3cam/03_person_detector-usbconsole-merged.bin"
description = "ESP32-S3 only: Person Detector with the console on the chip's native USB."
console_baudrate = 115200
